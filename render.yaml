services:
  - type: web
    name: menugo-frontend
    runtime: static
    branch: master
    autoDeployTrigger: commit
    rootDir: menugo-frontend
    # Run install and build explicitly in the frontend folder to avoid
    # accidentally invoking the dev server. Using `--prefix` ensures
    # Render executes the commands in the correct subfolder.
    buildCommand: npm ci --prefix menugo-frontend && npm run build --prefix menugo-frontend
    staticPublishPath: dist

  - type: web
    name: menugo-backends
    runtime: node
    branch: master
    plan: free
    autoDeployTrigger: commit
    rootDir: menugo-backends
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
