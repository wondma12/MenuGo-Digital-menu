services:
  - type: web
    name: menugo-frontend
    runtime: static
    branch: master
    autoDeployTrigger: commit
    rootDir: menugo-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist



  - type: web
    name: menugo-backends
    runtime: node
    branch: master
    plan: free
    autoDeployTrigger: commit
    rootDir: menugo-backends
    buildCommand: npm ci --omit=dev
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /health
    envVars:
      - key: REDIS_ENABLED
        value: "false"

databases:
  - name: menugo-db
    databaseName: menugo
    user: menugo
    plan: free
